name: diagnostics-report

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/over-under-market-analysis
    paths:
      - "BOT.py"
      - "diagnostics.py"
      - "config.py"
      - "requirements.txt"
      - "tests/test_diagnostics.py"
      - "scripts/walk_forward_over_under.py"
      - "scripts/predict_upcoming.py"
      - "tests/test_predict_upcoming.py"
      - "tests/test_walk_forward_over_under.py"
      - "xgo.csv"
      - ".github/workflows/diagnostics-report.yml"

permissions:
  contents: read

# Keep only the newest diagnostics run for this branch. The separate
# tests workflow owns pytest, so this job focuses on the full backtest.
concurrency:
  group: diagnostics-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run chronological model evaluation and diagnostics
        run: python BOT.py xgo.csv --policy-only

      - name: Run expanding walk-forward research on TRAIN history only
        run: python scripts/walk_forward_over_under.py xgo.csv

      - name: Validate upcoming prediction CLI
        run: python scripts/predict_upcoming.py --help

      - name: Verify diagnostic reports
        run: |
          test -d reports/diagnostics
          test -d reports/walk_forward
          test -s reports/walk_forward/walk_forward_predictions.csv
          test -s reports/walk_forward/walk_forward_error_analysis.csv
          diagnostics_count=$(find reports/diagnostics -maxdepth 1 -type f -name '*.csv' | wc -l)
          walk_forward_count=$(find reports/walk_forward -maxdepth 1 -type f -name '*.csv' | wc -l)
          echo "Diagnostic CSV reports: $diagnostics_count"
          echo "Walk-forward CSV reports: $walk_forward_count"
          if [ "$diagnostics_count" -lt 5 ] || [ "$walk_forward_count" -lt 3 ]; then
            echo "::error::Expected five diagnostics CSVs and three walk-forward CSVs."
            find reports -maxdepth 3 -type f -print || true
            exit 1
          fi
          find reports/diagnostics reports/walk_forward -maxdepth 1 -type f -name '*.csv' -print

      - name: Upload diagnostic and walk-forward CSV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-opta-research-${{ github.run_id }}
          path: |
            reports/diagnostics/*.csv
            reports/walk_forward/*.csv
          if-no-files-found: error
          retention-days: 14

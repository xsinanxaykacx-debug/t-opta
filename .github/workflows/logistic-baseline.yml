name: logistic-baseline
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  train-and-backtest:
    # Run only after successful tests on main; verify freshness explicitly after checkout.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify checked-out commit and current main SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "Expected upstream test SHA: ${EXPECTED_SHA}"
          echo "Checked-out SHA:             ${ACTUAL_SHA}"
          echo "Current origin/main SHA:     ${REMOTE_MAIN_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "${REMOTE_MAIN_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train and run chronological backtest
        run: python scripts/run_logistic_baseline.py
      - name: Run draw probability and threshold diagnostics
        run: python scripts/analyze_draw_diagnostics.py
      - name: Upload baseline and draw diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: logistic-baseline-and-draw-diagnostics
          path: |
            reports/logistic_baseline_report.json
            reports/draw_diagnostics_report.json
          if-no-files-found: error
          retention-days: 30

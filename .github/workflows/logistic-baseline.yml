name: logistic-baseline
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  train-and-backtest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train and run chronological backtest
        run: python scripts/run_logistic_baseline.py
      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: logistic-baseline-report
          path: reports/logistic_baseline_report.json
          if-no-files-found: error
          retention-days: 30

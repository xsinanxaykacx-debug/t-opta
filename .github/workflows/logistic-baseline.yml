name: logistic-baseline
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  train-and-backtest:
    # Ignore stale successful test runs. Only evaluate the exact current main commit.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected commit: ${EXPECTED_SHA}"
          echo "Actual commit:   ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train and run chronological backtest
        run: python scripts/run_logistic_baseline.py
      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: logistic-baseline-report
          path: reports/logistic_baseline_report.json
          if-no-files-found: error
          retention-days: 30

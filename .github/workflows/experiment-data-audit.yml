name: experiment-data-audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - name: Inspect xgo dataset without modifying it
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("xgo.csv")
          if not path.exists():
              raise SystemExit("xgo.csv is missing")

          df = pd.read_csv(path, encoding="utf-8-sig", low_memory=False)
          print("RAW_ROWS", len(df))
          print("RAW_COLUMNS", len(df.columns))
          print("COLUMNS", list(df.columns))
          for col in ("Date", "League", "HomeTeam", "AwayTeam",
                      "Home_xG", "Away_xG", "FTHG", "FTAG",
                      "odds_Avg>2.5", "odds_Avg<2.5",
                      "odds_B365>2.5", "odds_B365<2.5",
                      "AvgC", "B365C", "MaxC", "PC"):
              if col in df.columns:
                  print("COLUMN", col, "NON_NULL", int(df[col].notna().sum()),
                        "DTYPE", str(df[col].dtype))

          required = ["Date", "League", "HomeTeam", "AwayTeam",
                      "Home_xG", "Away_xG", "FTHG", "FTAG"]
          missing = [c for c in required if c not in df.columns]
          if missing:
              raise SystemExit(f"Missing required columns: {missing}")

          clean = df.copy()
          clean["Date"] = pd.to_datetime(clean["Date"], errors="coerce", utc=True)
          for col in ("Home_xG", "Away_xG", "FTHG", "FTAG"):
              clean[col] = pd.to_numeric(clean[col], errors="coerce")
          clean = clean.dropna(subset=required).copy()
          clean = clean.sort_values(
              ["Date", "League", "HomeTeam", "AwayTeam"],
              kind="mergesort"
          ).reset_index(drop=True)
          print("CLEAN_ROWS", len(clean))
          cuts = (8500, 9400, 9700, 10000, 15734)
          start = 0
          parts = []
          for name, end in zip(
              ("TRAIN", "CALIBRATION", "POLICY_SELECT", "POLICY_CHECK", "FINAL_TEST"),
              cuts
          ):
              part = clean.iloc[start:end]
              if part.empty:
                  raise SystemExit(f"Empty partition: {name}")
              parts.append((name, part))
              print("PARTITION", name, len(part),
                    part["Date"].min().isoformat(),
                    part["Date"].max().isoformat())
              start = end
          for (left_name, left), (right_name, right) in zip(parts, parts[1:]):
              same_day = left["Date"].dt.normalize().max() == right["Date"].dt.normalize().min()
              print("BOUNDARY", left_name, "->", right_name,
                    "SAME_CALENDAR_DAY", bool(same_day),
                    "LEFT_LAST", left["Date"].max().isoformat(),
                    "RIGHT_FIRST", right["Date"].min().isoformat())
          print("DATE_MIN", clean["Date"].min().isoformat())
          print("DATE_MAX", clean["Date"].max().isoformat())
          print("DUPLICATE_FIXTURE_KEYS", int(clean.duplicated(
              ["Date", "League", "HomeTeam", "AwayTeam"]
          ).sum()))
          print("OVER_RATE", float(
              ((clean["FTHG"] + clean["FTAG"]) > 2.5).mean()
          ))
          print("UNDER_RATE", float(
              ((clean["FTHG"] + clean["FTAG"]) <= 2.5).mean()
          ))
          print("DATA_AUDIT_OK")
          PY
